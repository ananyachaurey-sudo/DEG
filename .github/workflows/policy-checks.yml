name: DEG policy checks

on:
  workflow_dispatch:
  push:

env:
  UC1: devkits/demand-flex/uc1-bdr-w-baselining/examples
  UC2: devkits/demand-flex/uc2-bid-curve-pac/examples
  NET: specification/policies/demand-flex-networkpolicy.rego
  CON: specification/policies/demand-flex-contractpolicy.rego
  GUIDE: docs/implementation-guides/v2/Demand_Flexibility/Demand_Flexibility.md

jobs:

  # ------------------------------------------------------------------
  # Must stay green. Anything red here is a regression.
  # ------------------------------------------------------------------
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: open-policy-agent/setup-opa@v2
        with: { version: latest }

      - name: Does the policy compile
        run: |
          echo "=== network policy ==="
          opa check specification/policies/demand-flex-networkpolicy.rego || true
          echo "=== contract policy ==="
          opa check specification/policies/demand-flex-contractpolicy.rego || true
          echo "=== network policy tests ==="
          opa check specification/policies/demand-flex-networkpolicy.rego \
                    specification/policies/test/demand-flex-networkpolicy_test.rego || true
          echo "=== done ==="

      - name: Every uc1 fixture passes the network policy
        run: |
          FAILED=0
          for f in $UC1/*.json; do
            V=$(opa eval -f json -d $NET -i "$f" \
                 'data.deg.policy.demand_flex_network.violations' \
                 | jq -c '.result[0].expressions[0].value')
            if [ "$V" = "[]" ]; then
              echo "  PASS  $(basename $f)"
            else
              echo "  FAIL  $(basename $f) -> $V"; FAILED=1
            fi
          done
          exit $FAILED

      - name: Settlement equals 436.25
        run: |
          FAILED=0
          for f in on-status-response-settled.json on-status-response-actuals.json; do
            S=$(opa eval -f json -d $CON -i "$UC1/$f" \
                 'data.deg.contracts.demand_flex.revenue_flows' \
                 | jq -r '.result[0].expressions[0].value
                          | map(select(.role=="seller")) | .[0].value')
            B=$(opa eval -f json -d $CON -i "$UC1/$f" \
                 'data.deg.contracts.demand_flex.revenue_flows' \
                 | jq -r '.result[0].expressions[0].value
                          | map(select(.role=="buyer")) | .[0].value')
            if [ "$S" = "436.25" ] && [ "$B" = "-436.25" ]; then
              echo "  PASS  $f  seller=$S buyer=$B"
            else
              echo "  FAIL  $f  seller=$S buyer=$B (expected 436.25 / -436.25)"; FAILED=1
            fi
          done
          exit $FAILED

      - name: Existing policy unit tests
        run: |
          opa test specification/policies/*.rego specification/policies/test/*.rego

      - name: Diff against upstream
        continue-on-error: true
        run: |
          git remote add upstream https://github.com/beckn/DEG.git || true
          git fetch --depth=1 upstream main
          echo "### Files changed vs upstream/main"
          git diff --stat upstream/main || true

      - name: Every fork edit is registered
        run: |
          IDS=$(grep -rhoE 'FORK EDIT FC-[0-9]+' \
                  --include='*.rego' --include='*.json' --include='*.yaml' \
                  . 2>/dev/null | grep -oE 'FC-[0-9]+' | sort -u)
          if [ -z "$IDS" ]; then echo "no fork edits yet"; exit 0; fi
          FAILED=0
          for id in $IDS; do
            if grep -q "$id" FORK-CHANGES.md; then
              echo "  OK       $id"
            else
              echo "  MISSING  $id not in FORK-CHANGES.md"; FAILED=1
            fi
          done
          exit $FAILED

  # ------------------------------------------------------------------
  # Green means the documented defects are STILL PRESENT.
  # Red here means something changed - check whether it was fixed.
  # ------------------------------------------------------------------
  known-defects:
    name: Known defects (green = still broken)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with: { version: latest }

      - name: D1 bid-curve payloads against the network policy
        run: |
          REJECTED=0; TOTAL=0; OTHER=0
          for f in $UC2/*.json; do
            TOTAL=$((TOTAL+1))
            V=$(opa eval -f json -d $NET -i "$f" \
                 'data.deg.policy.demand_flex_network.violations' \
                 | jq -c '.result[0].expressions[0].value')
            if [ "$V" = "[]" ]; then
              echo "  PASS  $(basename $f)"
            else
              REJECTED=$((REJECTED+1))
              echo "  FAIL  $(basename $f)"
              echo "$V" | jq -r '.[]' | sed 's/^/          /'
              # anything other than the rule 3a stage gate is unexpected
              echo "$V" | jq -r '.[]' \
                | grep -v "requires a CAPACITY_OFFERED column" \
                | grep -q . && OTHER=$((OTHER+1))
            fi
          done
          echo
          echo "rejected $REJECTED of $TOTAL"

          FAILED=0
          if [ "$REJECTED" -ne 3 ]; then
            echo "  ASSERT FAILED: expected exactly 3 rejections, got $REJECTED"
            echo "  Fewer means the rule 3a fixtures were fixed (see FC-002)."
            echo "  More means something regressed."
            FAILED=1
          fi
          if [ "$OTHER" -ne 0 ]; then
            echo "  ASSERT FAILED: $OTHER fixture(s) rejected for a reason other"
            echo "  than the rule 3a stage gate. The column locks should be gone."
            FAILED=1
          fi
          exit $FAILED
          
      - name: "D2 - a partial page still settles to a full figure"
        run: |
          FAILED=0
          for f in on-status-response-actuals-paged-push.json \
                   on-status-response-actuals-paged-pull.json; do
            LAST=$(jq -r '[.message.contract.performance[]?
                          .performanceAttributes.pageInfo.isLast][0]' "$UC1/$f")
            N=$(jq -r '[.message.contract.performance[]?
                        .performanceAttributes.meters[]?.meterId] | length' "$UC1/$f")
            TOT=$(jq -r '[.message.contract.performance[]?
                          .performanceAttributes.pageInfo.total][0]' "$UC1/$f")
            S=$(opa eval -f json -d $CON -i "$UC1/$f" \
                 'data.deg.contracts.demand_flex.revenue_flows' \
                 | jq -r '.result[0].expressions[0].value
                          | map(select(.role=="seller")) | .[0].value')
            echo "  $f: isLast=$LAST meters_in_page=$N total=$TOT settles=$S"
            if [ "$LAST" = "false" ] && [ "$S" = "436.25" ]; then
              echo "        DEFECT PRESENT"
            else
              echo "        UNEXPECTED - behaviour changed"; FAILED=1
            fi
          done
          exit $FAILED

      - name: "D3 - the implementation guide contradicts the fixtures"
        run: |
          G525=$(grep -c '525' $GUIDE || true)
          G436=$(grep -c '436.25' $GUIDE || true)
          GUSAGE=$(grep -c '"USAGE"' $GUIDE || true)
          FUSAGE=$(grep -c '"USAGE"' $UC1/on-status-response-actuals.json || true)
          echo "  guide mentions 525:      $G525"
          echo "  guide mentions 436.25:   $G436"
          echo "  guide USAGE columns:     $GUSAGE"
          echo "  fixture USAGE columns:   $FUSAGE"
          FAILED=0
          [ "$G525" -gt 0 ]   || { echo "  UNEXPECTED: 525 gone"; FAILED=1; }
          [ "$G436" -eq 0 ]   || { echo "  UNEXPECTED: guide now cites 436.25"; FAILED=1; }
          [ "$GUSAGE" -eq 0 ] || { echo "  UNEXPECTED: guide now shows USAGE"; FAILED=1; }
          [ "$FUSAGE" -gt 0 ] || { echo "  UNEXPECTED: fixture lost USAGE"; FAILED=1; }
          exit $FAILED
