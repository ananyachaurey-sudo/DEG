name: DEG policy checks

on:
  workflow_dispatch:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Existing policy unit tests
        if: always()
        continue-on-error: true
        run: |
          opa test specification/policies/*.rego specification/policies/test/*.rego -v

      - name: Fixture inventory
        if: always()
        run: |
          echo "--- uc1 examples ---"; ls devkits/demand-flex/uc1-bdr-w-baselining/examples/
          echo "--- uc2 examples ---"; ls devkits/demand-flex/uc2-bid-curve-pac/examples/

      - name: "CHECK A - does the shipped example settle to 436.25"
        if: always()
        continue-on-error: true
        run: |
          C=specification/policies/demand-flex-contractpolicy.rego
          for f in on-status-response-settled.json on-status-response-actuals.json; do
            P=devkits/demand-flex/uc1-bdr-w-baselining/examples/$f
            echo "=============== $f"
            echo "--- violations:"
            opa eval -f pretty -d $C -i $P 'data.deg.contracts.demand_flex.violations'
            echo "--- revenue_flows:"
            opa eval -f pretty -d $C -i $P 'data.deg.contracts.demand_flex.revenue_flows'
          done

      - name: "CHECK B - are bid-curve payloads rejected by the network policy"
        if: always()
        continue-on-error: true
        run: |
          N=specification/policies/demand-flex-networkpolicy.rego
          echo "### uc2 (bid curve) - expecting column-lock violations"
          for f in devkits/demand-flex/uc2-bid-curve-pac/examples/*.json; do
            echo "=============== $(basename $f)"
            opa eval -f pretty -d $N -i "$f" 'data.deg.policy.demand_flex_network.violations'
          done
          echo
          echo "### uc1 control - expecting these to be clean"
          for f in devkits/demand-flex/uc1-bdr-w-baselining/examples/*.json; do
            echo "=============== $(basename $f)"
            opa eval -f pretty -d $N -i "$f" 'data.deg.policy.demand_flex_network.violations'
          done

      - name: "CHECK C - does a partial page settle anyway"
        if: always()
        continue-on-error: true
        run: |
          C=specification/policies/demand-flex-contractpolicy.rego
          for f in on-status-response-actuals-paged-push.json on-status-response-actuals-paged-pull.json; do
            P=devkits/demand-flex/uc1-bdr-w-baselining/examples/$f
            echo "=============== $f"
            echo "--- pageInfo says:"
            jq -c '.message.contract.performance[]?.performanceAttributes.pageInfo' $P
            echo "--- meters actually in this page:"
            jq -c '[.message.contract.performance[]?.performanceAttributes.meters[]?.meterId]' $P
            echo "--- revenue_flows:"
            opa eval -f pretty -d $C -i $P 'data.deg.contracts.demand_flex.revenue_flows'
          done
